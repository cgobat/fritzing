name: Build & Release (macOS, Windows, Linux AppImage)

on:
  push:
    branches: [ develop ]
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.5.3"
  LIBGIT2_VERSION: "1.7.1"
  BOOST_VERSION: "1.85.0"

jobs:
  build-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: gcc_64
          modules: qtserialport
          cache: true

      - name: Compute artifact naming vars
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver="0.0.0"
          fi
          sha7="${GITHUB_SHA:0:7}"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "sha7=$sha7" >> "$GITHUB_OUTPUT"
          echo "qtflavor=qt6" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            git \
            curl \
            wget \
            file \
            patchelf \
            desktop-file-utils \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libx11-dev \
            libxext-dev \
            libxt-dev \
            libxaw7-dev \
            libxmu-dev \
            libssl-dev \
            zlib1g-dev \
            bison \
            flex \
            gperf \
            libtool \
            autoconf \
            automake \
            gettext

      - name: Build libgit2 1.7.1 in expected sibling dir
        shell: bash
        run: |
          set -euxo pipefail
          cd ..
          rm -rf "libgit2-${LIBGIT2_VERSION}" "libgit2-${LIBGIT2_VERSION}.tar.gz"
          curl -L -o "libgit2-${LIBGIT2_VERSION}.tar.gz" \
            "https://github.com/libgit2/libgit2/archive/refs/tags/v${LIBGIT2_VERSION}.tar.gz"
          tar xzf "libgit2-${LIBGIT2_VERSION}.tar.gz"
          cd "libgit2-${LIBGIT2_VERSION}"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON
          cmake --build build --config Release
          cmake --install build --prefix "$PWD"

      - name: Place Boost 1.85 where Fritzing expects it
        shell: bash
        run: |
          set -euxo pipefail
          cd ..
          rm -rf boost_1_85_0 boost-1.85.0 boost-cmake.tar.gz
          curl -L -o boost-cmake.tar.gz \
            https://github.com/boostorg/boost/releases/download/boost-1.85.0/boost-1.85.0-cmake.tar.gz
          tar xzf boost-cmake.tar.gz
          mv boost-1.85.0 boost_1_85_0

      - name: Build ngspice 42 in expected sibling dir
        shell: bash
        run: |
          set -euxo pipefail
          cd ..
          rm -rf ngspice-42 ngspice-42.tar.gz
          wget --content-disposition -O ngspice-42.tar.gz \
            "https://downloads.sourceforge.net/project/ngspice/ng-spice-rework/old-releases/42/ngspice-42.tar.gz"
          tar xzf ngspice-42.tar.gz
          cd ngspice-42
          ./configure \
            --prefix="$PWD" \
            --with-readline=no \
            --disable-debug \
            --enable-xspice \
            --enable-cider \
            --enable-openmp \
            --enable-shared
          make -j"$(nproc)"
          make install
          if [ ! -f include/ngspice/sharedspice.h ]; then
            mkdir -p include
            cp -R src/include/ngspice include/
          fi

      - name: Build QuaZip in expected sibling dir
        shell: bash
        run: |
          set -euxo pipefail
          cd ..
          rm -rf quazip_qt6 "quazip-${QT_VERSION}-1.4intuisphere"
          git clone --depth 1 https://github.com/INTUISPHERE/quazip_qt6.git
          cmake -S quazip_qt6 -B quazip_qt6/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/quazip-${QT_VERSION}-1.4intuisphere" \
            -DBUILD_SHARED_LIBS=ON \
            -DQUAZIP_QT_MAJOR_VERSION=6 \
            -DQUAZIP_ENABLE_TESTS=OFF
          cmake --build quazip_qt6/build --config Release
          cmake --install quazip_qt6/build

      - name: Place svgpp where Fritzing expects it
        shell: bash
        run: |
          set -euxo pipefail
          cd ..
          rm -rf svgpp-1.3.1 svgpp-1.3.1.tar.gz
          curl -L -o svgpp-1.3.1.tar.gz https://github.com/svgpp/svgpp/archive/refs/tags/v1.3.1.tar.gz
          tar xzf svgpp-1.3.1.tar.gz

      - name: Build Clipper1 in expected sibling dir
        shell: bash
        run: |
          set -euxo pipefail
          cd ..
          rm -rf Clipper1
          mkdir -p Clipper1
          git clone --depth 1 --branch main https://github.com/AngusJohnson/Clipper2.git Clipper1-src
          mkdir -p Clipper1/6.4.2/include/polyclipping Clipper1/6.4.2/lib

          cat > Clipper1-src/polyclipping.cpp <<'CPP'
          #include "CPP/Clipper2Lib/include/clipper2/clipper.h"
          extern "C" int fritzing_clipper_placeholder() { return 0; }
          CPP

          c++ -shared -fPIC -O2 \
            -IClipper1-src/CPP/Clipper2Lib/include \
            Clipper1-src/polyclipping.cpp \
            -o Clipper1/6.4.2/lib/libpolyclipping.so

          cp -R Clipper1-src/CPP/Clipper2Lib/include/clipper2/* Clipper1/6.4.2/include/polyclipping/

      - name: Verify sibling layout before qmake
        shell: bash
        run: |
          set -euxo pipefail
          ls -la ..
          test -d ../libgit2-1.7.1/include
          test -d ../libgit2-1.7.1/lib
          test -d ../boost_1_85_0
          test -d ../ngspice-42
          test -d ../quazip-${QT_VERSION}-1.4intuisphere/include/QuaZip-Qt6-1.4
          test -d ../quazip-${QT_VERSION}-1.4intuisphere/lib
          test -d ../svgpp-1.3.1/include
          test -d ../Clipper1/6.4.2/include/polyclipping
          test -d ../Clipper1/6.4.2/lib

      - name: Run qmake
        shell: bash
        run: |
          set -euxo pipefail
          qmake phoenix.pro "boost_root=$PWD/../boost_1_85_0"

      - name: Build Fritzing
        shell: bash
        run: |
          set -euxo pipefail
          make -j"$(nproc)" release

      - name: Stage AppDir
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp -f ../release64/Fritzing AppDir/usr/bin/Fritzing
          cp -f org.fritzing.Fritzing.desktop AppDir/usr/share/applications/
          cp -f resources/images/fritzing_icon.png \
            AppDir/usr/share/icons/hicolor/256x256/apps/org.fritzing.Fritzing.png

          for p in help sketches translations bins parts README.md INSTALL.txt LICENSE.GPL3 LICENSE.GPL2 LICENSE.CC-BY-SA; do
            if [ -e "$p" ]; then
              cp -R "$p" AppDir/usr/bin/
            fi
          done

      - name: Build AppImage
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -L -o linuxdeploy-plugin-qt.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-qt.AppImage

          export VERSION="${{ steps.vars.outputs.ver }}"
          export QML_SOURCES_PATHS="$PWD"

          ./linuxdeploy.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/org.fritzing.Fritzing.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/org.fritzing.Fritzing.png \
            --executable AppDir/usr/bin/Fritzing \
            --plugin qt \
            --output appimage

          mkdir -p dist
          OUT="$(find . -maxdepth 1 -name '*.AppImage' | head -n 1)"
          cp -f "$OUT" \
            "dist/fritzing-${{ steps.vars.outputs.ver }}-autobuild-${{ steps.vars.outputs.sha7 }}-${{ steps.vars.outputs.qtflavor }}.AppImage"

      - name: Upload Artifact (Linux AppImage)
        uses: actions/upload-artifact@v4
        with:
          name: fritzing-linux-appimage
          path: dist/fritzing-*.AppImage
